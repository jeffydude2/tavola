<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurants | Tavola</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap"><link rel="stylesheet" href="assets/css/styles.css"></head><body>
<main class="wrap">
<section class="page-head"><span class="tag">Manage</span><h1 style="font-size:clamp(2.2rem,5vw,3.6rem);margin-top:8px">All restaurants</h1><p>Add a new restaurant, edit details or delete an entry. Changes save to Atlas immediately.</p></section>
<div class="toolbar"><label>Borough<select id="fBorough"></select></label><label>Cuisine<select id="fCuisine"></select></label><button class="btn primary" id="addBtn" type="button" style="margin-left:auto">Add restaurant</button></div>
<p class="small" id="count">&nbsp;</p>
<div class="tablewrap"><table><thead><tr><th>Name</th><th>Cuisine</th><th>Borough</th><th>Address</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager"><button class="btn sm" id="prev" type="button">Previous</button><span id="pageInfo" class="small"></span><button class="btn sm" id="next" type="button">Next</button></div>
<dialog id="formDialog"><form id="restaurantForm"><h2 id="dlgTitle">Add restaurant</h2><input type="hidden" name="id">
 <label>Name<input name="name" required maxlength="120"></label>
 <label>Cuisine<input name="cuisine" required maxlength="80"></label>
 <label>Borough<select name="borough" required></select></label>
 <div class="row2"><label>Building<input name="building"></label><label>Street<input name="street"></label></div>
 <label>Zipcode<input name="zipcode" inputmode="numeric" maxlength="10"></label>
 <p class="err" id="formError"></p>
 <div class="dlg-actions"><button class="btn" type="button" id="cancel">Cancel</button><button class="btn primary" type="submit">Save restaurant</button></div></form></dialog>
</main>
<script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script src="assets/js/pages/restaurants.js"></script></body></html>
